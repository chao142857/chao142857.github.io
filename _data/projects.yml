- title: Astra × RealMan
  description: "Integrated gpt6-astra with a RealMan dual-arm control loop through multi-camera observations and a target-pose action interface. Ran four real-robot trials (~30 min each), achieving one complete pick–handoff–place execution, and analyzed failure modes in spatial grounding and action execution."
  tech: "Multimodal Reasoning · RealMan · Dual-Arm Manipulation"
