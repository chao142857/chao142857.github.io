- title: "π0.5 × RealMan — Real-World Robot Manipulation"
  description: "Fine-tuned π0.5 on 50 teleoperated demonstrations and deployed it on a real RealMan robot for banana pick-and-place. Compared fine-tuning strategies: action-expert-only fine-tuning achieved 9/10 successful onsite pilot trials, while LoRA fine-tuning achieved 0/8."
  tech: "Vision-Language-Action · Imitation Learning · Real-World Deployment"
  image: /images/projects/pi05-realman.gif
  still: /images/projects/pi05-realman.png
  alt: "RealMan robot performing banana pick-and-place"
