- title: "nSGS — Neural Success-Guided Sampling"
  description: "nSGS explores how a neural task sampler can guide PPO training for Go2–Piper whole-body control. Preliminary experiments across four student seeds show a modest average improvement over uniform sampling; cross-seed generalization is under investigation."
